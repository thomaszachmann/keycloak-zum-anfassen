# kc-probe/compose.yaml – Probe-Instanz für Upgrades mit eigener Datenbank (Tag 12)
# KC_VERSION wählt das Image, ./import enthält den Export des Realms lab
name: kc-probe

services:
  probe-db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: lab-kc-db-pw-123
      POSTGRES_DB: keycloak
    volumes:
      - probe-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 10

  probe:
    image: quay.io/keycloak/keycloak:${KC_VERSION:-26.8.0}
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://probe-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: lab-kc-db-pw-123
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: lab-admin-pw-123
    volumes:
      - ./import:/opt/keycloak/data/import:ro
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      probe-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -m1 status <&3 | grep -q UP"]
      interval: 5s
      timeout: 3s
      start_period: 300s
      retries: 10

volumes:
  probe-data:
