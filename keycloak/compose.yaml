# keycloak/compose.yaml – Keycloak im Produktionsmodus mit Postgres (Tag 1)
name: keycloak

services:
  kc-db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: lab-kc-db-pw-123
      POSTGRES_DB: keycloak
    volumes:
      - kc-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://kc-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: lab-kc-db-pw-123
      KC_HOSTNAME: ${KC_URL:?KC_URL fehlt – source ~/kc-lab/setup/env.sh}
      KC_HTTP_ENABLED: "true"           # bis Tag 12 ohne TLS
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: lab-admin-pw-123
    volumes:
      - ./truststores:/opt/keycloak/conf/truststores:ro   # CA-Zertifikate (ab Tag 9)
      - ./themes:/opt/keycloak/themes:ro                  # eigene Themes (ab Tag 11)
    ports:
      - "8080:8080"
      - "127.0.0.1:9000:9000"           # Health und Metriken
    depends_on:
      kc-db:
        condition: service_healthy
    healthcheck:
      # erste Zeile mit "status" ist der Gesamtstatus, die Einzelprüfungen folgen
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -m1 status <&3 | grep -q UP"]
      interval: 5s
      timeout: 3s
      start_period: 300s                # erster Start legt das Schema an
      retries: 10

volumes:
  kc-data:

networks:
  default:
    name: lab
