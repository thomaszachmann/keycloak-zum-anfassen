# k8s/postgres.yaml – Postgres für Keycloak im Namespace keycloak (Tag 14, nur Labor)
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-db
  namespace: keycloak
stringData:
  username: keycloak
  password: lab-kc-db-pw-123
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: keycloak
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:18.6-alpine
          env:
            - {name: POSTGRES_DB, value: keycloak}
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: keycloak-db, key: username}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: keycloak-db, key: password}}
          ports:
            - containerPort: 5432
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "keycloak", "-d", "keycloak"]}
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: {storage: 2Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: keycloak
spec:
  selector: {app: postgres}
  ports:
    - port: 5432
