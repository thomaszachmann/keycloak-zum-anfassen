# notes-stack/compose.yaml – notes mit Login: oauth2-proxy vor notes-web (Tag 4)
name: notes

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: lab-db-pw-123
      POSTGRES_DB: notes
    volumes:
      - notes-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes -d notes"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: notes-api:0.4.0
    command: ["migrate"]
    environment: &api-env
      NOTES_API_KEY: lab-api-key-123
      NOTES_DB_URL: postgres://notes:lab-db-pw-123@db:5432/notes
      NOTES_OIDC_ISSUER: ${KC_URL:?source ~/kc-lab/setup/env.sh}/realms/lab
      NOTES_OIDC_ROLE: notes-schreiben
      NOTES_OIDC_AUDIENCE: ${NOTES_AUDIENCE:-}      # ab Tag 5: notes-api
    depends_on:
      db:
        condition: service_healthy

  notes-api:
    image: notes-api:0.4.0
    environment: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully

  notes-web:
    image: notes-web:0.2.0
    environment:
      NOTES_API_URL: http://notes-api:8080

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
    command:
      - --provider=keycloak-oidc
      - --oidc-issuer-url=${KC_URL}/realms/lab
      - --client-id=notes-web
      - --client-secret=lab-client-secret-123
      - --cookie-secret=${COOKIE_SECRET:?COOKIE_SECRET fehlt, siehe Tag 4}
      - --cookie-secure=false                 # bis Tag 12 ohne TLS
      - --code-challenge-method=S256
      - --scope=openid profile email
      - --email-domain=*
      - --skip-provider-button=true           # gleich zu Keycloak statt eigener Seite
      - --pass-access-token=true              # X-Forwarded-Access-Token an notes-web
      - --upstream=http://notes-web:3000
      - --http-address=0.0.0.0:4180
      - --redirect-url=${NOTES_URL}/oauth2/callback
      # Abmelden beendet auch die Sitzung in Keycloak (Tag 4, Drill 6)
      - --backend-logout-url=${KC_URL}/realms/lab/protocol/openid-connect/logout?id_token_hint={id_token}
    ports:
      - "4180:4180"

volumes:
  notes-data:

networks:
  default:
    name: lab
    external: true
