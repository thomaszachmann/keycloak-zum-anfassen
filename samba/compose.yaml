# samba/compose.yaml – Samba als Active Directory Domain Controller (Tag 9)
name: samba

services:
  dc1:
    image: diegogslomp/samba-ad-dc:4.25.1
    hostname: DC1
    privileged: true                     # Samba braucht ACLs und xattrs im Dateisystem
    environment:
      REALM: AD.NOTES.LAB
      DOMAIN: NOTES
      ADMIN_PASS: Lab-Ad-Pw-123          # muss die Komplexitätsregeln von AD erfüllen
      DNS_FORWARDER: 1.1.1.1
      BIND_NETWORK_INTERFACES: "false"
    volumes:
      - dc1-etc:/usr/local/samba/etc
      - dc1-private:/usr/local/samba/private
      - dc1-var:/usr/local/samba/var
    networks:
      default:
        aliases:
          - dc1.ad.notes.lab             # Name im TLS-Zertifikat von Samba

volumes:
  dc1-etc:
  dc1-private:
  dc1-var:

networks:
  default:
    name: lab
    external: true
