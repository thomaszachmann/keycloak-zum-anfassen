# keycloak-ha/compose.yaml – zwei Keycloak-Instanzen hinter Caddy mit TLS (Tag 12)
# ersetzt ~/kc-lab/keycloak/compose.yaml, gleiche Datenbank (Volume kc-data)
name: keycloak

x-keycloak: &keycloak
  image: quay.io/keycloak/keycloak:26.8.1
  command: ["start"]
  environment:
    KC_DB: postgres
    KC_DB_URL: jdbc:postgresql://kc-db:5432/keycloak
    KC_DB_USERNAME: keycloak
    KC_DB_PASSWORD: lab-kc-db-pw-123
    KC_HOSTNAME: ${KC_URL:?KC_URL fehlt – source ~/kc-lab/setup/env.sh}
    KC_HTTP_ENABLED: "true"             # TLS endet am Proxy
    KC_PROXY_HEADERS: xforwarded        # Proxy setzt X-Forwarded-*
    KC_HEALTH_ENABLED: "true"
    KC_METRICS_ENABLED: "true"
    KC_BOOTSTRAP_ADMIN_USERNAME: admin
    KC_BOOTSTRAP_ADMIN_PASSWORD: lab-admin-pw-123
  volumes:
    - ./truststores:/opt/keycloak/conf/truststores:ro
    - ./themes:/opt/keycloak/themes:ro
  depends_on:
    kc-db:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -m1 status <&3 | grep -q UP"]
    interval: 5s
    timeout: 3s
    start_period: 300s
    retries: 10

services:
  kc-db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: lab-kc-db-pw-123
      POSTGRES_DB: keycloak
    volumes:
      - kc-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    <<: *keycloak
    ports:
      - "127.0.0.1:9000:9000"           # Health und Metriken von Instanz 1

  keycloak-2:
    <<: *keycloak

  proxy:
    image: caddy:2.11.7-alpine
    environment:
      VM_IP: ${VM_IP:?source ~/kc-lab/setup/env.sh}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../tls:/certs:ro
    ports:
      - "443:443"
    depends_on:
      - keycloak
      - keycloak-2

volumes:
  kc-data:

networks:
  default:
    name: lab
